name = "cryptopiggy-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# The public edge. It holds no key and no store — it forwards to the private engine, adds CORS, and maps
# the engine's SUGGESTION-ONLY /market/* endpoints (planner /plan → chooser strategies + View-plan detail).
# PROD: the engine has no public route; reach it via service bindings (uncomment) so it stays private.
# [[services]]
# binding = "ENGINE"
# service = "cryptopiggy-engine"
# [[services]]
# binding = "PLANNER"           # the engine's planner (the app's /market/* calls it)
# service = "cryptopiggy-planner"

[vars]
# DEV: the engine runs on its own `wrangler dev` ports; forward there. PROD swaps these for the bindings above.
ENGINE_URL = "http://127.0.0.1:8788"
PLANNER_URL = "http://127.0.0.1:8791"   # the engine planner (dev); the app's /market/* endpoints call it
CORS_ORIGIN = "*"
# DEV: "true" serves the in-repo mock engine (src/mock.ts) so the frontend has a real backend to hit
# before the private engine exists. Set to "false" (or bind ENGINE) to proxy to the real engine.
MOCK = "true"

# --- production: `wrangler deploy --env production`. Reach the PRIVATE planner (no public URL) via a
#     service binding, so the app's /market/* calls the real v2 engine over the wire. The residual
#     routes (/me/portfolio, /operations/*) stay on the mock — the old single-engine was never built and
#     the real app executes CLIENT-side; MOCK=true is only the fallback here. ---
# SECRETS (set via `wrangler secret put --env production`, NOT here): ZEROX_API_KEY, PIMLICO_API_KEY,
#     PIMLICO_SPONSORSHIP_POLICY_ID.
#     PIMLICO_API_KEY backs the /gasless/rpc proxy (the browser's paymaster+bundler endpoint); keep the
#     Pimlico sponsorship policy's spending limits tight — that is the real guard against paymaster drain.
#     PIMLICO_SPONSORSHIP_POLICY_ID is that policy's id, stamped into paymaster calls SERVER-side
#     (src/gasless.ts) so those limits actually bind. Leave it unset and they're advisory only: the policy
#     would ride in the caller's paymasterContext, where anyone hitting the proxy can simply omit it.
[[env.production.services]]
binding = "PLANNER" # → cryptopiggy-planner-production (private)
service = "cryptopiggy-planner-production"

# Backs the per-sender daily gasless quota (table `gasless_quota`, created on demand). Same shared store
# as the ops indexer / engine; the `gasless_` prefix keeps it clear of their tables.
[[env.production.d1_databases]]
binding = "DB"
database_name = "cryptopiggy_market"
database_id = "d3a2a0c2-7ed2-44de-969f-6fe4255452c0"

[env.production.vars]
CORS_ORIGIN = "https://piggy.onl" # the live app origin (www 301s here, so this is the only browser origin)
MOCK = "true"
# WE fund the gas, so /gasless/rpc only sponsors ops that (a) target OUR contracts and (b) are inside the
# sender's daily quota. Targets allowed: the factory (createAccount), the caller's OWN account — derived
# locally via CREATE2, no RPC — and USDC (withdraw-elsewhere transfer). Everything downstream of
# executePlan is already constrained on-chain by the registry's approved protocols/routes.
# Unset GASLESS_FACTORY disables both checks. Addresses: contracts/DEPLOYMENTS.md.
GASLESS_FACTORY = "0x81af551F6346AE358966f3BF64d16d6105Ea1e8A"
GASLESS_IMPL = "0x866fd7a8ea0d4d4fd0fabc42312074153c44d119" # SmartInvestmentAccount impl the factory clones
GASLESS_USDC = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
GASLESS_DAILY_LIMIT = "10" # sponsored transactions per sender per UTC day
